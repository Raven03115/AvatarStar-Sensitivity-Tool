name: Materialize v1.0

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/materialize-v1.yml'
      - '.package/**'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify and extract package
        shell: bash
        run: |
          set -euo pipefail
          cat .package/v1.b64.* > /tmp/avatarstar-v1.b64
          base64 --decode /tmp/avatarstar-v1.b64 > /tmp/avatarstar-v1.zip
          echo "7ed22432c4e46a78caa0f1888f8cf77b03c27e83cdb9e60f327e1b8e0328f0fe  /tmp/avatarstar-v1.zip" | sha256sum --check --strict
          rm -rf /tmp/avatarstar-v1
          mkdir -p /tmp/avatarstar-v1
          unzip -q /tmp/avatarstar-v1.zip -d /tmp/avatarstar-v1
          test -d /tmp/avatarstar-v1/AvatarStar_Sensitivity_Tool_v1.0

      - name: Commit clean v1.0 source tree
        shell: bash
        run: |
          set -euo pipefail
          cp -a /tmp/avatarstar-v1/AvatarStar_Sensitivity_Tool_v1.0/. ./
          rm -rf .package
          rm -f .github/workflows/materialize-v1.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Materialize Avatar Star Sensitivity Tool v1.0"
          git push
